name: Build ExtremeOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add password protection to Addons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("composeApp/src/commonMain/kotlin/com/nuvio/app/features/addons/AddonsScreen.kt")
          text = path.read_text()

          if "import androidx.compose.material3.OutlinedTextField" not in text:
              text = text.replace(
                  "import androidx.compose.material3.MaterialTheme\n",
                  "import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedTextField\n",
                  1,
              )

          if "import androidx.compose.ui.text.input.PasswordVisualTransformation" not in text:
              text = text.replace(
                  "import androidx.compose.ui.text.style.TextOverflow\n",
                  "import androidx.compose.ui.text.input.PasswordVisualTransformation\nimport androidx.compose.ui.text.style.TextOverflow\n",
                  1,
              )

          start = text.index("@Composable\nfun AddonsScreen(")
          marker = "\n@Composable\ninternal fun AddonsSettingsPageContent("
          end = text.index(marker, start)

          new_lines = [
              "@Composable",
              "fun AddonsScreen(",
              "    modifier: Modifier = Modifier,",
              "    title: String? = null,",
              "    onBack: (() -> Unit)? = null,",
              ") {",
              "    var isUnlocked by rememberSaveable { mutableStateOf(false) }",
              '    var password by rememberSaveable { mutableStateOf("") }',
              "    var passwordError by rememberSaveable { mutableStateOf(false) }",
              "",
              "    NuvioScreen(modifier = modifier) {",
              "        stickyHeader {",
              "            NuvioScreenHeader(",
              "                title = title ?: stringResource(Res.string.addon_title),",
              "                onBack = onBack,",
              "            ) {",
              "            }",
              "        }",
              "        item {",
              "            if (isUnlocked) {",
              "                AddonsSettingsPageContent()",
              "            } else {",
              "                Column(",
              "                    modifier = Modifier",
              "                        .fillMaxWidth()",
              "                        .padding(16.dp),",
              "                    verticalArrangement = Arrangement.spacedBy(12.dp),",
              "                ) {",
              '                    Text(text = "Addon section is locked")',
              "                    OutlinedTextField(",
              "                        value = password,",
              "                        onValueChange = {",
              "                            password = it",
              "                            passwordError = false",
              "                        },",
              "                        modifier = Modifier.fillMaxWidth(),",
              "                        singleLine = true,",
              '                        label = { Text("Password") },',
              "                        visualTransformation = PasswordVisualTransformation(),",
              "                        isError = passwordError,",
              "                    )",
              "                    if (passwordError) {",
              '                        Text("Incorrect password", color = MaterialTheme.colorScheme.error)',
              "                    }",
              "                    NuvioPrimaryButton(",
              '                        text = "Unlock Addons",',
              "                        enabled = password.isNotBlank(),",
              "                        onClick = {",
              '                            if (password == "400400400") {',
              "                                isUnlocked = true",
              '                                password = ""',
              "                                passwordError = false",
              "                            } else {",
              "                                passwordError = true",
              "                            }",
              "                        },",
              "                    )",
              "                }",
              "            }",
              "        }",
              "    }",
              "}",
          ]

          text = text[:start] + "\n".join(new_lines) + text[end:]
          path.write_text(text)
          print("Addon password lock added.")
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew
        
      - name: Create local.properties
        run: touch local.properties
        
      - name: Build APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ExtremeOS-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

name: Build Extreme DV Player APK

on:
  workflow_dispatch:
  push:
    branches: ["extreme-dv-player"]
    paths:
      - "Extreme-DV-Player/**"
      - ".github/workflows/build-extreme-dv-player.yml"
  pull_request:
    branches: ["cmp-rewrite"]
    paths:
      - "Extreme-DV-Player/**"
      - ".github/workflows/build-extreme-dv-player.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Extreme-DV-Player

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libdovi JNI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o app/src/main/jniLibs \
            build --release --manifest-path native-rpu/Cargo.toml

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Extreme-DV-Player-0.3-debug
          path: Extreme-DV-Player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
